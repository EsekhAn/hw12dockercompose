services:
  db:
    image: mysql:8.0
    container_name: app42-db
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: rootpasswor
      MYSQL_DATABASE: app42db
      MYSQL_USER: app42user
      MYSQL_PASSWORD: app42password
    ports:
      - "3306:3306"
    volumes:
      - db_data:/var/lib/mysql
  app:
    build: .
    container_name: app42-app
    restart: unless-stopped
    ports:
      - "8080:8080"
    depends_on:
      db:
        condition: service_healthy
volumes:
  db_data: