services:
  db:
    image: mysql:8.0
    container_name: app42-db
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: rootpasswor
      MYSQL_DATABASE: app42db
      MYSQL_USER: app42user
      MYSQL_PASSWORD: app42password
    ports:
      - "3306:3306"
    volumes:
      - db_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-prootpassword"]
      interval: 10s
      timeout: 5s
      retries: 5
volumes:
  db_data: